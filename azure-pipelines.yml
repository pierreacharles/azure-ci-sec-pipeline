# AUTHOR NAME: Pierre-Antoine Charles
# DATE: Saturday 17-October-2026
# SUBJECT: ADO CI/CD Pipeline for GCP, Containers (Py), AWS and GitHub development of operations.

# YAML is neither imperative nor declarative; it is a data-serialization language like JSON.
# ==========================================================================================
name: AGAPrjCICT-Pipeline

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'
  dockerImageName: 'pierrecharles441/agaprj-docker-repository-deploys'
  dockerHubRepository: 'pierrecharles441/agaprj-docker-repository-deploys'
  dockerHubServiceConnection: 'login.docker.com_pierrecharles441'
  enableDockerPush: 'true'
  snykServiceConnection: 'Snyk-Security-Scan-ADO-Service-Connection'
  awsServiceConnection: 'aws-prod-oidc'
  awsRegion: 'us-east-1'
  gcpServiceConnection: 'GCP-Terraform-ADO-Service-Connection'
  gcpProjectId: 'high-electron-275217'

# =====================
# GITHUB ACTIONS - TRIGGER
# =====================
resources:
  repositories:
  - repository: githubTarget
    type: github
    name: pierreacharles/azure-ci-sec-pipeline
    endpoint: pierreacharles
    ref: refs/heads/main
    trigger:
      branches:
        include:
          - main

# =====================
# CONTINUOUS INTEGRATION - VALIDATION
# =====================
stages:
  - stage: DevOpsExpertStageA
    # Compile and run both Python entry points from ADO, or from GitHub when
    # this run was started by the GitHub repository resource trigger.
    displayName: 'CI: Validate Python application'
    jobs:
      - job: PythonChecks
        displayName: Compile and run Python entry points
        steps:
          - checkout: self
            path: ado-source
          - checkout: githubTarget
            path: github-source
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: Select Python $(pythonVersion)
          - script: |
              set -euo pipefail
              source_dir="$(Pipeline.Workspace)/ado-source"
              if [ "$(Build.Reason)" = "ResourceTrigger" ]; then
                source_dir="$(Pipeline.Workspace)/github-source"
              fi
              cd "$source_dir"
              python -m compileall -q main.py src/ado_package/main.py
              python main.py
              python src/ado_package/main.py
            displayName: Compile and execute application scripts

# =====================
# GCP TERRAFORM CONNECTIVITY CHECK
# =====================
  - stage: GcpTerraformConnectivity
    dependsOn: DevOpsExpertStageA
    condition: succeededOrFailed()
    displayName: 'CI: Test GCP connectivity with Terraform'
    jobs:
      - job: VerifyGcpConnectivity
        displayName: Verify GCP service connection authentication
        steps:
          - checkout: self
            path: ado-source
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.9.8'
          - bash: |
              set -euo pipefail
              terraform -chdir="$(Pipeline.Workspace)/ado-source/terraform/gcp-connectivity" init \
                -backend=false \
                -input=false \
                -no-color
            displayName: Initialize read-only connectivity configuration
          - task: TerraformTaskV4@4
            displayName: Verify GCP authentication with Terraform
            inputs:
              provider: gcp
              command: plan
              workingDirectory: $(Pipeline.Workspace)/ado-source/terraform/gcp-connectivity
              commandOptions: '-input=false -no-color -var=project_id=$(gcpProjectId)'
              environmentServiceNameGCP: $(gcpServiceConnection)

# =====================
# DEPENDENCY SCAN STAGE
# =====================
  - stage: DevOpsExpertStageB
    # Ensure the selected checkout has all application and Docker inputs before
    # the more expensive image build and security scan.
    dependsOn: DevOpsExpertStageA
    displayName: 'CI: Verify Docker build inputs'
    jobs:
      - job: DockerContext
        displayName: Check required application and container files
        steps:
          - checkout: self
            path: ado-source
          - checkout: githubTarget
            path: github-source
          - bash: |
              set -euo pipefail
              source_dir="$(Pipeline.Workspace)/ado-source"
              if [ "$(Build.Reason)" = "ResourceTrigger" ]; then
                source_dir="$(Pipeline.Workspace)/github-source"
              fi
              test -s "$source_dir/main.py"
              test -s "$source_dir/src/ado_package/main.py"
              test -s "$source_dir/Dockerfile"
            displayName: Verify build inputs exist

# =====================
# BUILD CONTAINER AND EXECTUTE PYTHON STAGE
# =====================
  - stage: DevOpsExpertStageC
    # Build and smoke-test the non-root image, publish its SBOM, fail on
    # HIGH/CRITICAL findings, and package the image for Snyk scanning.
    dependsOn:
      - DevOpsExpertStageB
    displayName: 'CI: Build, test, and security-scan container'
    jobs:
      - job: BuildAndTestImage
        displayName: Build and verify hardened container
        steps:
          - checkout: self
            path: ado-source
          - checkout: githubTarget
            path: github-source
          - bash: |
              set -euo pipefail
              source_dir="$(Pipeline.Workspace)/ado-source"
              if [ "$(Build.Reason)" = "ResourceTrigger" ]; then
                source_dir="$(Pipeline.Workspace)/github-source"
              fi
              DOCKER_BUILDKIT=1 docker build \
                --pull \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                --build-arg BUILD_VERSION="$(Build.BuildId)" \
                --file "$source_dir/Dockerfile" \
                --tag "$(dockerImageName):$(Build.BuildId)" \
                --tag "$(dockerImageName):latest" \
                "$source_dir"
            displayName: Build multi-stage application image
          - bash: |
              set -euo pipefail
              image="$(dockerImageName):$(Build.BuildId)"
              output="$(docker run --rm "$image")"
              printf '%s\n' "$output"
              grep -Fq "Python script started successfully in Azure Pipelines!" <<< "$output"
              test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
              docker image inspect --format 'Image={{.Id}} User={{.Config.User}} Size={{.Size}}' "$image"
            displayName: Smoke-test output and non-root runtime
          - bash: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$(Build.ArtifactStagingDirectory):/report" \
                aquasec/trivy:0.66.0 image \
                --format cyclonedx \
                --output /report/container-sbom.cdx.json \
                "$(dockerImageName):$(Build.BuildId)"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:0.66.0 image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                "$(dockerImageName):$(Build.BuildId)"
            displayName: Scan image for high and critical vulnerabilities
          - bash: |
              set -euo pipefail
              cat > "$(Build.ArtifactStagingDirectory)/release-manifest.json" <<EOF
              {
                "image": "$(dockerHubRepository)",
                "tag": "$(Build.BuildId)",
                "latestTag": "latest",
                "sourceVersion": "$(Build.SourceVersion)",
                "buildId": "$(Build.BuildId)"
              }
              EOF
              cat "$(Build.ArtifactStagingDirectory)/release-manifest.json"
              docker save \
                --output "$(Build.ArtifactStagingDirectory)/image.tar" \
                "$(dockerImageName):$(Build.BuildId)"
            displayName: Create container release manifest
          - task: PublishPipelineArtifact@1
            displayName: Publish container SBOM
            condition: succeededOrFailed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/container-sbom.cdx.json
              artifact: container-sbom
          - task: PublishPipelineArtifact@1
            displayName: Publish container image and release metadata for scanning
            condition: succeeded()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: container-release

# =====================
# SNYK CONTAINER SECURITY SCAN STAGE
# =====================
  - stage: SnykSecurityScan
    # Scan the exact built image before it is pushed to Docker Hub or promoted
    # through release environments; fail on HIGH or CRITICAL vulnerabilities.
    dependsOn: DevOpsExpertStageC
    displayName: 'CI: Snyk container security scan'
    jobs:
      - job: SnykContainerAnalysis
        displayName: Scan built image with Snyk Container
        steps:
          - checkout: self
            path: ado-source
          - checkout: githubTarget
            path: github-source
          - download: current
            artifact: container-release
          - bash: |
              set -euo pipefail
              image_archive="$(Pipeline.Workspace)/container-release/image.tar"
              test -s "$image_archive"
              docker load --input "$image_archive"
              source_dir="$(Pipeline.Workspace)/ado-source"
              if [ "$(Build.Reason)" = "ResourceTrigger" ]; then
                source_dir="$(Pipeline.Workspace)/github-source"
              fi
              echo "##vso[task.setvariable variable=snykDockerfilePath]$source_dir/Dockerfile"
            displayName: Load exact CI image for Snyk analysis
          - task: SnykSecurityScan@1
            displayName: Scan container image for vulnerabilities
            inputs:
              serviceConnectionEndpoint: $(snykServiceConnection)
              testType: container
              dockerImageName: $(dockerImageName):$(Build.BuildId)
              dockerfilePath: $(snykDockerfilePath)
              severityThreshold: high
              failOnIssues: true
              monitorWhen: never

  - stage: PublishContainer
    # Publish only the image that passed both Trivy and Snyk security gates.
    dependsOn: SnykSecurityScan
    condition: and(succeeded(), eq(variables['enableDockerPush'], 'true'))
    displayName: 'CI: Publish scanned image to Docker Hub'
    jobs:
      - job: PushScannedImage
        displayName: Push versioned and latest image tags
        steps:
          - download: current
            artifact: container-release
          - task: Docker@2
            displayName: Authenticate to Docker Hub
            inputs:
              command: login
              containerRegistry: $(dockerHubServiceConnection)
          - bash: |
              set -euo pipefail
              docker load \
                --input "$(Pipeline.Workspace)/container-release/image.tar"
              docker tag \
                "$(dockerImageName):$(Build.BuildId)" \
                "$(dockerImageName):latest"
            displayName: Load and tag Snyk-approved image
          - task: Docker@2
            displayName: Push scanned image tags to Docker Hub
            inputs:
              command: push
              containerRegistry: $(dockerHubServiceConnection)
              repository: $(dockerHubRepository)
              tags: |
                $(Build.BuildId)
                latest

  - stage: AwsIdentityCheck
    # Verify the existing AWS service connection with a read-only STS identity
    # request even if the independent Docker Hub push fails.
    dependsOn: DevOpsExpertStageC
    displayName: Validate AWS service connection
    condition: succeededOrFailed()
    jobs:
      - job: VerifyAwsIdentity
        displayName: Verify configured AWS identity
        steps:
          - task: AWSCLI@1
            displayName: Call AWS STS get-caller-identity
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              awsCommand: sts
              awsSubCommand: get-caller-identity

# =====================
# GITHUB SERVICE CONNECTION STAGE
# =====================
  - stage: DevOpsExpertStageG
    # Copy ADO main to GitHub main and push only when files changed. Resource-
    # triggered runs skip this stage so the sync cannot trigger itself forever.
    dependsOn:
      - PublishContainer
      - AwsIdentityCheck
    condition: and(not(failed()), not(canceled()), ne(variables['Build.Reason'], 'ResourceTrigger'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.PublishContainer.result, 'Succeeded'), in(dependencies.AwsIdentityCheck.result, 'Succeeded', 'Skipped'))
    displayName: 'CD: Synchronize validated source to GitHub'
    jobs:
      - job: jobG
        displayName: Commit and push source changes
        steps:
          - checkout: self
            path: ado-source
          - checkout: githubTarget
            persistCredentials: true
            path: github-target
          - task: Bash@3
            displayName: Pushing Source to GitHub Repository
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                echo "Sourcing ADO Directory:"
                cd $(Pipeline.Workspace)/github-target
                git config user.email "azure-pipelines@users.noreply.github.com"
                git config user.name "Azure Pipelines"
                rsync -a --exclude='.git/' "$(Pipeline.Workspace)/ado-source/" .
                git add .
                if ! git diff --cached --quiet; then
                  git commit -m "Sync from Azure DevOps build $(Build.BuildId)"
                  push_attempt=1
                  max_push_attempts=3
                  while [ "$push_attempt" -le "$max_push_attempts" ]; do
                    if git push origin HEAD:refs/heads/main; then
                      break
                    fi
                    if [ "$push_attempt" -eq "$max_push_attempts" ]; then
                      echo "GitHub push was rejected after $max_push_attempts attempts." >&2
                      exit 1
                    fi
                    echo "GitHub main advanced during the push; rebasing on the latest remote main before retrying."
                    git pull --rebase origin main
                    push_attempt=$((push_attempt + 1))
                  done
                else
                  echo "GitHub already matches the source; nothing to push."
                fi

# =====================
# CONTINUOUS DELIVERY - RELEASE RECORDS
# =====================
  - stage: Release_QA
    # Record the security-approved container release in QA. This gate-only
    # deployment does not provision or update a runtime target.
    dependsOn: PublishContainer
    condition: and(succeeded(), eq(variables['enableDockerPush'], 'true'))
    displayName: CD Release - QA
    jobs:
      - deployment: RecordQARelease
        displayName: Record container release in QA
        environment: QA
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: container-release
                - bash: |
                    set -euo pipefail
                    cat "$(Pipeline.Workspace)/container-release/release-manifest.json"
                    echo "QA release record only; no runtime deployment target is configured."
                  displayName: Verify package and record QA release

  - stage: Release_Test
    # Record the same immutable build package in Test after the QA gate.
    dependsOn: Release_QA
    condition: and(succeeded(), eq(variables['enableDockerPush'], 'true'))
    displayName: CD Release - Test
    jobs:
      - deployment: RecordTestRelease
        displayName: Record container release in Test
        environment: Test
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: container-release
                - bash: |
                    set -euo pipefail
                    cat "$(Pipeline.Workspace)/container-release/release-manifest.json"
                    echo "Test release record only; no runtime deployment target is configured."
                  displayName: Verify package and record Test release

  - stage: Release_PRD
    # Record the same immutable build package in PRD after QA and Test.
    dependsOn: Release_Test
    condition: and(succeeded(), eq(variables['enableDockerPush'], 'true'))
    displayName: CD Release - PRD
    jobs:
      - deployment: RecordPRDRelease
        displayName: Record container release in PRD
        environment: PRD
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: container-release
                - bash: |
                    set -euo pipefail
                    cat "$(Pipeline.Workspace)/container-release/release-manifest.json"
                    echo "PRD release record only; no runtime deployment target is configured."
                  displayName: Verify package and record PRD release

  - stage: Finalize
    # Always run a final reporting job; inspect earlier stage results in the
    # Azure Pipelines run summary because this job's status is not the build's.
    dependsOn:
      - DevOpsExpertStageA
      - GcpTerraformConnectivity
      - DevOpsExpertStageB
      - DevOpsExpertStageC
      - SnykSecurityScan
      - PublishContainer
      - AwsIdentityCheck
      - DevOpsExpertStageG
      - Release_QA
      - Release_Test
      - Release_PRD
    condition: always()
    jobs:
      - job: ReportStatus
        steps:
          - bash: |
              echo "Final reporting job: $(Agent.JobStatus)"
              echo "Pipeline stage results are available in the Azure Pipelines run summary."
              echo "Pierre-Antoine Charles, you're an Expert Platform Engineer (Level 3) and you deserve the best numerated fulltime job/project opportunities in this market! We'll make sure you remain active throughout the longevity of the job/project because YOU'VE PROVEN YOURSELF/PEERS..."
            displayName: Report pipeline results
