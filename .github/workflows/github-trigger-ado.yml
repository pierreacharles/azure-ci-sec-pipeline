# =====================
# GITHUB-TRIGGER FOR AZ-CI-SEC-PIPELINE
# =====================

name: GitHub-IAM-Roles
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Run tests/build here"
      - name: Trigger Azure DevOps pipeline
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          : "${AZURE_CLIENT_ID:?Missing GitHub secret AZURE_CLIENT_ID}"
          : "${AZURE_CLIENT_SECRET:?Missing GitHub secret AZURE_CLIENT_SECRET}"
          : "${AZURE_TENANT_ID:?Missing GitHub secret AZURE_TENANT_ID}"
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az pipelines run --name "AGAPrjCICT-Pipeline" --project "AGA Assurance Collective Prj 1" --org "https://dev.azure.com/DevOpsExpertOrg1"
